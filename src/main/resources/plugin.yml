name: PlaytimeNameColor
version: ${project.version}
main: org.zerobzerot.playtimenamecolor.PlaytimeNameColor
api-version: 1.16
prefix: PNC
authors: [bierdosenhalter, F64_Rx, XSilverFalconX]
description: A spigot plugin where players are rewarded with additional name colors for their joining date and playing time.
commands:
  nc:
    description: Selects the color of the player name in the chat.
    usage: /nc [Player] <Color>[-Bold]
  mute:
    description: Use this command to mute a player.
    usage: /mute <Player>
  unmute:
      description: Use this command to unmute a player.
      usage: /unmute <Player>